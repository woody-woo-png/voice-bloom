<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>목소리꽃 · Voice Bloom</title>
<meta name="description" content="Turn a loved one's voice into a one-of-a-kind blossoming tree. 소중한 사람의 목소리가 꽃나무로 피어납니다.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0c1028; --card:rgba(255,255,255,.05); --line:rgba(255,255,255,.1);
    --text:#f1eefc; --muted:#a3a6c9; --accent:#ffb8cb; --accent2:#cbb8ff;
    --sans:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
    --serif:"Noto Serif KR","Batang","AppleMyungjo",Georgia,serif;
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 20% 0%,#232a5e 0%,transparent 55%),var(--bg);
    color:var(--text);font:15px/1.6 var(--sans);padding:0 16px 60px}
  button,label.btn{font:inherit;color:inherit;cursor:pointer}
  header{max-width:1080px;margin:0 auto;padding:18px 0;display:flex;align-items:center;justify-content:space-between;gap:10px}
  .logo{font-family:var(--serif);font-size:22px;font-weight:600;letter-spacing:1px}
  .logo span{color:var(--accent)}
  .lang{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 14px;font-size:13px;color:var(--muted)}
  .lang:hover{color:var(--text)}
  .wrap{max-width:1080px;margin:0 auto;display:grid;grid-template-columns:minmax(0,480px) minmax(0,1fr);gap:48px;align-items:start}
  .stage{position:relative;border-radius:18px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.45);border:1px solid var(--line)}
  #poster{display:block;width:100%;aspect-ratio:3/4}
  .overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
    background:rgba(8,10,30,.72);backdrop-filter:blur(6px);text-align:center;padding:16px}
  .ring{width:150px;height:150px;border-radius:50%;display:grid;place-items:center;font-size:38px;font-weight:200;
    font-variant-numeric:tabular-nums;border:2px solid rgba(255,184,203,.5);transition:box-shadow .08s}
  .overlay p{margin:0;color:var(--muted)}
  h1{font-family:var(--serif);font-weight:600;font-size:36px;line-height:1.35;margin:10px 0 14px;letter-spacing:-.5px}
  h1 em{font-style:normal;color:var(--accent)}
  .lead{color:var(--muted);margin:0 0 24px}
  .btns{display:flex;flex-direction:column;gap:10px}
  .btn{display:flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--card);
    border-radius:14px;padding:13px 18px;transition:.2s;text-align:center}
  .btn:hover{background:rgba(255,255,255,.1)}
  .btn.primary{border:0;color:#2a1222;font-weight:700;background:linear-gradient(135deg,#ffc8d6,#d9c9ff);box-shadow:0 10px 30px rgba(255,170,200,.25)}
  .btn.danger{color:#ff9a9a;border-color:rgba(255,120,120,.4)}
  .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
  .row .btn{flex:1;min-width:130px}
  .field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
  .field>span{font-size:12px;color:var(--muted)}
  input[type=text]{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;color:var(--text);font:inherit;outline:none;width:100%}
  input[type=text]:focus{border-color:rgba(255,184,203,.55)}
  .seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px}
  .seg button{flex:1;border:0;background:none;padding:8px;border-radius:9px;color:var(--muted)}
  .seg button.on{background:rgba(255,255,255,.12);color:var(--text)}
  .reading{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:14px 0 18px;font-size:14px}
  .reading b{color:var(--accent);font-weight:600}
  .members{display:flex;flex-wrap:wrap;gap:8px}
  .chip{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 8px 5px 12px;font-size:13px}
  .chip i{font-style:normal;width:10px;height:10px;border-radius:50%}
  .chip button{border:0;background:none;color:var(--muted);padding:0 4px;font-size:14px;line-height:1}
  .chip button:hover{color:#ff9a9a}
  .sharebox{margin-top:12px;background:rgba(255,184,203,.07);border:1px solid rgba(255,184,203,.3);border-radius:14px;padding:12px 14px}
  .sharebox input{font-size:12px;padding:9px 10px}
  .sharebox small{display:block;color:var(--muted);margin-top:8px;font-size:12px}
  details{margin-top:26px;color:var(--muted);font-size:14px}
  summary{cursor:pointer;color:var(--text)}
  details ul{padding-left:18px;margin:10px 0 0}
  .privacy{margin-top:16px;font-size:12px;color:var(--muted)}
  .guide{margin-top:18px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;font-size:13.5px;color:var(--muted)}
  .guide>b{color:var(--text);font-weight:600}
  .guide ol{margin:8px 0 8px;padding-left:20px}
  .guide li{margin:3px 0}
  .guide li b,.guide small b{color:var(--accent);font-weight:600}
  .guide small{display:block;font-size:12px}
  .hint{margin:8px 2px 0;font-size:12px;color:var(--muted)}
  .seg.mode{margin-bottom:22px}
  .hearts{display:flex;flex-wrap:wrap;gap:7px}
  .hchip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13px;color:var(--muted)}
  .hchip.on{border-color:rgba(255,184,203,.6);background:rgba(255,184,203,.12);color:var(--text)}
  .hhint{font-size:12px;color:var(--muted)}
  .hhint b{color:var(--accent);font-weight:600}
  .gstat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:0 0 18px}
  .gline{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
  .gline b{color:var(--accent);font-weight:600}
  .gbar{height:6px;border-radius:9px;background:rgba(255,255,255,.08);margin:10px 0 8px;overflow:hidden}
  .gbar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,#ffc8d6,#d9c9ff);transition:width .8s}
  .gstat small{display:block;font-size:12.5px;color:var(--muted)}
  #toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,30px);opacity:0;background:rgba(30,30,60,.95);
    border:1px solid var(--line);padding:10px 18px;border-radius:999px;transition:.35s;pointer-events:none;max-width:calc(100% - 32px);z-index:5}
  #toast.show{opacity:1;transform:translate(-50%,0)}
  @media (max-width:860px){
    .wrap{grid-template-columns:1fr;gap:26px}
    h1{font-size:28px}
  }
</style>
</head>
<body>
<header>
  <div class="logo" id="logo"></div>
  <button class="lang" id="langBtn"></button>
</header>
<div class="wrap">
  <div class="stage">
    <canvas id="poster" width="750" height="1000"></canvas>
    <div class="overlay" id="recOverlay" hidden>
      <div class="ring" id="ring">10</div>
      <p data-i="listening"></p>
      <button class="btn primary" id="stopBtn" style="min-width:160px" data-i="done"></button>
    </div>
  </div>

  <div>
    <div class="seg mode" id="modeSeg"><button data-mode="gift" class="on" data-i="modeGift"></button><button data-mode="garden" data-i="modeGarden"></button></div>
    <section id="intro">
      <h1 id="introTitle"></h1>
      <p class="lead" id="introLead"></p>
      <label class="field"><span data-i="whoLabel"></span>
        <input type="text" id="who" maxlength="12" data-ph="whoPh"></label>
      <div class="field"><span data-i="heartLabel"></span><div class="hearts" id="hearts"></div><small class="hhint" id="heartHint"></small></div>
      <div class="btns">
        <button class="btn primary" id="recBtn" data-i="rec"></button>
        <label class="btn"><span data-i="upload"></span><input type="file" id="file" accept="audio/*,video/*" hidden></label>
        <button class="btn" id="sampleBtn" data-i="sample"></button>
        <button class="btn" id="backBtn" data-i="back" hidden></button>
      </div>
      <div class="guide">
        <b data-i="guideTitle"></b>
        <ol id="guideList"></ol>
        <small id="guideTip"></small>
      </div>
      <p class="privacy" data-i="privacy"></p>
    </section>

    <section id="result" hidden>
      <h1 id="resTitle" style="font-size:30px"></h1>
      <div class="reading" id="reading"></div>
      <div class="field"><span data-i="membersLabel"></span><div class="members" id="members"></div></div>
      <label class="field"><span data-i="titleLabel"></span>
        <input type="text" id="title" maxlength="24"></label>
      <div class="field"><span data-i="moodLabel"></span>
        <div class="seg" id="themeSeg"><button data-theme="night" class="on" data-i="night"></button><button data-theme="paper" data-i="paper"></button></div></div>
      <div class="row">
        <button class="btn primary" id="addBtn" data-i="add"></button>
        <button class="btn" id="shareBtn" data-i="share"></button>
      </div>
      <p class="hint" data-i="shareHint"></p>
      <div class="sharebox" id="shareBox" hidden>
        <input type="text" id="shareUrl" readonly>
        <small data-i="shareHelp"></small>
      </div>
      <div class="row">
        <button class="btn" id="replayBtn" data-i="replay"></button>
        <button class="btn" id="saveBtn" data-i="save"></button>
      </div>
      <div class="row"><button class="btn" id="newBtn" data-i="reset"></button></div>
    </section>

    <section id="garden" hidden>
      <h1 id="gTitle"></h1>
      <p class="lead" id="gLead"></p>
      <div class="gstat" id="gStat" hidden>
        <div class="gline"><b id="gCount"></b><span id="gStage"></span></div>
        <div class="gbar"><i id="gBar"></i></div>
        <small id="gToBloom"></small>
        <small id="gToday"></small>
        <small id="gNote"></small>
      </div>
      <label class="field"><span data-i="gNameLabel"></span>
        <input type="text" id="gName" maxlength="12" data-ph="gNamePh"></label>
      <div class="field"><span data-i="heartLabel"></span><div class="hearts" id="gHearts"></div><small class="hhint" id="gHeartHint"></small></div>
      <div class="btns">
        <button class="btn primary" id="gRecBtn"></button>
        <label class="btn"><span data-i="upload"></span><input type="file" id="gFile" accept="audio/*,video/*" hidden></label>
      </div>
      <div class="field" id="gLogField" style="margin-top:18px"><span data-i="gLogLabel"></span><div class="members" id="gLog"></div></div>
      <div class="row" id="gBtnRow">
        <button class="btn" id="gSaveBtn" data-i="save"></button>
        <button class="btn" id="gResetBtn" data-i="gReset"></button>
      </div>
      <p class="privacy" data-i="gPrivacy"></p>
    </section>

    <details>
      <summary data-i="howTitle"></summary>
      <ul id="howList"></ul>
    </details>
  </div>
</div>
<div id="toast"></div>

<script>
/* ========== 다국어 (한국어 / English) ========== */
const koFlower = p => p.endsWith('꽃') ? p : p + ' 꽃';   // '벚꽃 꽃'처럼 겹치지 않게
const koTint = p => p.endsWith('빛') ? p : p + '빛';      // '단풍빛 장미', '물빛 장미'
const T = {
  ko: {
    docTitle: '목소리꽃', logo: '목소리<span>꽃</span>', langBtn: 'EN',
    listening: '듣고 있어요… 편하게 말씀해 주세요', done: '완료',
    introTitle0: '소중한 사람의 목소리가<br><em>꽃나무</em>로 피어납니다', introTitleN: '숲에 <em>목소리</em>를 더해요',
    introLead0: '목소리의 높낮이, 크기, 말의 리듬을 읽어 세상에 단 하나뿐인 꽃나무를 그려요. 가족이 한 명씩 목소리를 더하면 우리 가족만의 숲이 자라요.',
    introLeadN: n => `지금 ${n}그루가 자라고 있어요. 이름을 적고 목소리를 들려주면 숲에 새 나무가 자라요.`,
    whoLabel: '누구의 목소리인가요?', whoPh: '예) 엄마, 지우, 할아버지',
    rec: '🎙 지금 녹음하기 (최대 10초)', upload: '📁 음성 파일 올리기 (음성 메시지 등)', sample: '✨ 샘플 목소리로 보기', back: '← 숲으로 돌아가기',
    privacy: '🔒 녹음과 분석은 모두 이 기기 안에서만 이뤄져요. 목소리는 어디에도 전송되지 않고, 공유 링크에는 나무 모양 정보만 담겨요.',
    res1: '목소리가 <em>피었어요</em>', resN: '가족 숲이 <em>자라고 있어요</em>',
    membersLabel: '숲의 목소리들', titleLabel: '그림 제목', titlePh1: '예) 엄마의 목소리', titlePhN: '예) 우리 가족 숲',
    moodLabel: '분위기', night: '밤하늘', paper: '한지',
    add: '➕ 목소리 더하기', share: '🔗 가족에게 공유',
    shareHelp: '이 링크를 가족 단톡방에 보내 주세요. 링크를 연 가족이 자기 목소리를 더하면, 나무가 한 그루 늘어난 새 링크가 만들어져요.',
    replay: '▶ 다시 피우기', save: '💾 그림 저장', reset: '🗑 숲 새로 시작', resetConfirm: '정말 숲을 지울까요? 한 번 더 누르세요',
    howTitle: '나무는 어떻게 만들어지나요?',
    how: ['<b>왼쪽 가지는 말의 시작, 오른쪽 가지는 말의 끝</b>이에요.', '목소리가 높아지는 순간의 가지는 하늘로 곧게, 낮아지는 순간의 가지는 옆으로 늘어져요.',
      '크게 말한 부분일수록 꽃이 크고 풍성해요. 잠깐 쉰 부분은 꽃 없이 빈 가지로 남아요.', '평균 음높이가 꽃의 색(8가지)을, 말의 리듬이 가지 수를 정해요.',
      '높낮이를 살려 말할수록 목소리가 올라간 자리에 다른 색 꽃이 섞여 피어요. 말 빠르기에 따라 섞이는 색이 달라져요.',
      '마음을 고르면 그 꽃말을 가진 꽃 모양(장미·카네이션·물망초·프리지아·히아신스)으로 피어요. 색은 여전히 목소리가 정해요.',
      '<b>🌱 매일 키우기</b>에서는 하루 한 번 들려줄 때마다 나무가 자라고, 8번이면 꽃이 활짝 펴요.',
      '땅 아래 뿌리는 실제 목소리의 파형이에요.', '가족 숲에는 최대 6그루까지 심을 수 있어요.'],
    removeTip: '이 나무 빼기', removeConfirm: '정말 뺄까요?', noName: '이름 없음', me: '나',
    tQuiet: '소리가 너무 작아요. 조금 더 크게 말해 주세요', tShort: '조금 더 길게(1초 이상) 말해 주세요', tBad: '이 소리는 읽을 수 없어요',
    tMic: '마이크를 쓸 수 없어요. 브라우저의 마이크 권한을 확인해 주세요', tRecFail: '녹음을 읽지 못했어요. 다시 시도해 주세요',
    tFileFail: '이 파일 형식은 읽지 못했어요 (mp3, m4a, wav 권장)', tMax: n => `숲에는 최대 ${n}그루까지 심을 수 있어요`,
    tRemoved: name => `${name}를 숲에서 뺐어요`, tCopied: '공유 링크를 복사했어요. 가족 단톡방에 붙여 넣어 주세요', tCopyManual: '링크를 길게 눌러 복사해 주세요',
    tSaved: '고화질 그림(2250×3000)을 저장했어요. 액자 인쇄에 쓸 수 있어요', tLinkFail: '공유 링크를 읽지 못했어요. 링크가 잘렸는지 확인해 주세요',
    pEmptyTitle: '목소리를 들려주세요', pEmptySub: '말하는 순간, 한 그루의 꽃나무가 자라요', pForest: '우리 가족 숲',
    pNameTitle: name => `${name}의 목소리`, pPrecious: '소중한 목소리',
    pSub1: (d, dur, syl, hz, pal) => `${d} · ${dur}초 · ${syl}음절 · ${hz}${pal}`, pSubN: (d, n) => `${d} · ${n}개의 목소리로 자란 숲`, pBrand: '목 소 리 꽃',
    pal: { camellia: '동백', maple: '단풍', gold: '금빛', mint: '민트', water: '물빛', lavender: '라벤더', cherry: '벚꽃', peony: '모란' },
    tone: { none: '음높이를 읽기 어려운 소리', low: '낮고 따뜻한 목소리', mid: '부드러운 중간 높이의 목소리', high: '맑고 높은 목소리' },
    expr: { wide: '높낮이가 풍부해서 가지가 넓게 퍼졌어요', mid: '높낮이가 적당해서 가지가 고르게 뻗었어요', calm: '차분하게 말해서 가지가 곧게 자랐어요' },
    readMember: (name, tone, pal, syl, expr, acc, fl, hana) => [[name ? name + '님은 ' : ''], [tone, 1], ['라서 '],
      ...(fl ? [[`${koTint(pal)} ${fl[0]}`, 1], [`${fl[1]} 피었어요.`]] : [[koFlower(pal), 1], ['이 피었어요.']]),
      ['\n'], [`${syl}번의 말소리 리듬으로 가지를 나누었고, ${expr}.`],
      ...(acc ? [['\n'], ['목소리가 올라간 순간마다 '], [koFlower(acc), 1], ['이 섞여 피었어요.']] : []),
      ...(hana ? [['\n'], ['꽃말 '], [`“${hana}”`, 1]] : [])],
    readLink: names => [[names, 1], ['의 목소리로 자란 숲이 도착했어요.'], ['\n'], ['아래 '], ['➕ 목소리 더하기', 1], ['로 내 나무를 심고, 새 링크를 다시 가족에게 보내 주세요.']],
    shareTitle: '목소리꽃 가족 숲', shareText: names => `${names}의 목소리로 자란 숲이에요. 링크를 열고 '목소리 더하기'로 당신의 나무도 심어 주세요 🌸`,
    shareHint: '링크를 받은 가족이 각자 자기 목소리를 더하면, 떨어져 있어도 숲을 함께 키울 수 있어요.',
    guideTitle: '👨‍👩‍👧 떨어져 사는 가족과 함께 키우는 법',

function analyze(buffer) {
  const sr0 = buffer.sampleRate;
  let x = new Float32Array(buffer.length);
  for (let c = 0; c < buffer.numberOfChannels; c++) {
    const d = buffer.getChannelData(c);
    for (let i = 0; i < d.length; i++) x[i] += d[i] / buffer.numberOfChannels;
  }
  // 앞뒤 무음 자르기, 최대 10초
  let peak = 0; for (let i = 0; i < x.length; i++) peak = Math.max(peak, Math.abs(x[i]));
  if (peak < 0.01) throw new Error('quiet');
  const th = peak * 0.06; let a = 0, b = x.length - 1;
  while (a < b && Math.abs(x[a]) < th) a++;
  while (b > a && Math.abs(x[b]) < th) b--;
  a = Math.max(0, a - Math.floor(sr0 * 0.05)); b = Math.min(x.length - 1, b + Math.floor(sr0 * 0.1));
  b = Math.min(b, a + sr0 * 10);
  x = x.slice(a, b);
  const duration = x.length / sr0;
  if (duration < 0.4) throw new Error('short');

  // 약 12kHz로 줄여서 빠르게 분석
  const dec = Math.max(1, Math.round(sr0 / 12000)), sr = sr0 / dec;
  const y = new Float32Array(Math.floor(x.length / dec));
  for (let i = 0; i < y.length; i++) { let s = 0; for (let k = 0; k < dec; k++) s += x[i * dec + k]; y[i] = s / dec; }

  const N = 512, hop = 256, env = [], pitch = [];
  for (let s = 0; s + N <= y.length; s += hop) {
    let e = 0;
    for (let i = 0; i < N; i++) e += y[s + i] * y[s + i];
    env.push(Math.sqrt(e / N));
  }
  if (env.length < 4) throw new Error('short');
  const maxE = Math.max(...env);
  const minLag = Math.floor(sr / 500), maxLag = Math.floor(sr / 70);
  for (let f = 0; f < env.length; f++) {
    if (env[f] < maxE * 0.15) { pitch.push(0); continue; }
    const s = f * hop; let best = 0, bestLag = 0;
    for (let lag = minLag; lag <= maxLag; lag++) {
      let num = 0, e1 = 0, e2 = 0;
      for (let i = 0; i < N - lag; i++) { const p = y[s + i], q = y[s + i + lag]; num += p * q; e1 += p * p; e2 += q * q; }
      const r = num / Math.sqrt(e1 * e2 + 1e-12);
      if (r > best) { best = r; bestLag = lag; }
    }
    pitch.push(best > 0.55 ? sr / bestLag : 0);
  }
  const envN = env.map(v => v / maxE);
  const voiced = pitch.filter(v => v > 0).sort((p, q) => p - q);
  const median = voiced.length ? voiced[Math.floor(voiced.length / 2)] : 0;
  const semi = f => 12 * Math.log2(f / median);
  const rangeSemi = voiced.length > 4 ? semi(voiced[Math.floor(voiced.length * 0.9)]) - semi(voiced[Math.floor(voiced.length * 0.1)]) : 0;

  // 음높이 곡선 (-1 낮음 ~ +1 높음), 무성음 구간은 이웃 값으로 채움
  let pc = pitch.map(f => f > 0 && median ? clamp(semi(f) / 6, -1, 1) : null);
  let last = 0; pc = pc.map(v => v === null ? last : (last = v));
  pc = pc.map((v, i) => (v + (pc[i - 1] ?? v) + (pc[i + 1] ?? v)) / 3);

  // 음절 수 (소리 크기의 봉우리)
  const sm = envN.map((v, i) => { let s = 0, c = 0; for (let k = -2; k <= 2; k++) if (envN[i + k] !== undefined) { s += envN[i + k]; c++; } return s / c; });
  let syl = 0, lastPeak = -99, valley = 1;
  for (let i = 1; i < sm.length - 1; i++) {
    valley = Math.min(valley, sm[i]);
    if (sm[i] > 0.3 && sm[i] >= sm[i - 1] && sm[i] > sm[i + 1] && i - lastPeak > 5 && valley < sm[i] * 0.8) { syl++; lastPeak = i; valley = sm[i]; }
  }
  syl = Math.max(1, syl);

  // 같은 목소리 → 같은 나무
  let h = 2166136261;
  const mix = v => { h ^= v; h = Math.imul(h, 16777619); };
  for (let i = 0; i < 64; i++) { mix(Math.round(sampleAt(envN, i / 63) * 15)); mix(Math.round((sampleAt(pc, i / 63) + 1) * 7)); }
  mix(Math.round(median));

  const out = new AudioBuffer({ length: x.length, sampleRate: sr0, numberOfChannels: 1 });
  out.copyToChannel(x, 0);
  return { duration, env: envN, pitch: pc, median, rangeSemi, syl, seed: h >>> 0, audio: out };
}

    }
    const hint = $(hintId); hint.textContent = '';
    const parts = S.heart === 'none' ? [[t('heartHintNone')]] : t('heartHint')(t('flower')[S.heart][0], t('hana')[S.heart]);
    for (const [txt, bold] of parts) { if (bold) { const e = document.createElement('b'); e.textContent = txt; hint.append(e); } else hint.append(txt); }
  }
}

/* ========== 매일 키우기 (이 기기에만 저장) ========== */
const G_KEY = 'vb.garden', G_FULL = 8, G_MAX = 60;
const G_P = [0, 0.5, 0.66, 0.76, 0.82, 0.88, 0.93, 0.97, 1];       // 들려준 횟수별 자란 정도 (0.74부터 꽃이 핌)
const G_S = [0.5, 0.55, 0.65, 0.73, 0.8, 0.86, 0.92, 0.96, 1];     // 들려준 횟수별 나무 크기
const dayKey = (d = new Date()) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
function fmtDay(k, long) {
  const [y, m, d] = k.split('-').map(Number);
  if (LANG === 'en') return new Date(y, m - 1, d).toLocaleDateString('en-US', long ? { year: 'numeric', month: 'short', day: 'numeric' } : { month: 'short', day: 'numeric' });
  return long ? `${y}.${m}.${d}` : `${m}.${d}`;
}
let G = { name: '', entries: [] };
try {
  const o = JSON.parse(localStorage.getItem(G_KEY) || 'null');
  if (o && Array.isArray(o.entries)) G = {
    name: typeof o.name === 'string' ? o.name.slice(0, 12) : '',
    entries: o.entries.filter(c => { try { expand(c); return /^\d{4}-\d\d-\d\d$/.test(c.dt); } catch { return false; } }).slice(-G_MAX)
  };
} catch {}
function saveGarden() { try { localStorage.setItem(G_KEY, JSON.stringify(G)); return true; } catch { toast(t('gSaveFail')); return false; } }

// 새 목소리가 늘어도 이미 핀 꽃 색이 대부분 그대로 있도록: 각 꽃이 "몇 번째 날"을 맡을지 저수지 표본 방식으로 고정
function pickDay(k, n) {
  for (let i = n - 1; i > 0; i--) if (rng((k ^ Math.imul(i, 0x9e3779b1)) >>> 0)() < 1 / (i + 1)) return i;
  return 0;
}
const GV = { tree: null, f: null, p: 0, s: G_S[0], rootU: 1, from: 0, to: 0, sFrom: 0, sTo: 0, start: -1 };
function buildGarden() {
  const n = G.entries.length;
  if (!n) { GV.tree = null; GV.f = null; return; }
  const fs = G.entries.map(expand);
  const tree = genVoiceTree(fs[0]);   // 나무 모양은 첫 목소리가 정하고, 꽃은 날마다의 목소리가 나눠 맡는다
  tree.days = fs.map(f => ({ palette: palFor(f.median), shape: f.heart || 'bloom' }));
  (function walk(nd) { for (const lf of nd.leaves) lf.e = pickDay(lf.k, n); nd.children.forEach(walk); })(tree.root);
  GV.tree = tree; GV.f = fs[n - 1];   // 뿌리(파형)는 가장 최근 목소리
  const i = Math.min(n, G_FULL);
  if (GV.start < 0) { GV.p = GV.to = G_P[i]; GV.s = GV.sTo = G_S[i]; }
}
function gardenView() {
  const n = G.entries.length;
  if (GV.start >= 0) {
    const el = now() - GV.start, k = ease(clamp(el / 2.6));
    GV.p = GV.from + (GV.to - GV.from) * k; GV.s = GV.sFrom + (GV.sTo - GV.sFrom) * k;
    GV.rootU = GV.f ? clamp(el / GV.f.duration) : 1;
    if (el >= 2.6 && GV.rootU >= 1) GV.start = -1;
  }
  if (!n || !GV.tree) return { theme: S.theme, members: [], sub: t('pGardenEmpty'), note: '' };
  const last = G.entries[n - 1], lastF = GV.f;
  return {
    theme: S.theme, scaleMul: GV.s,
    members: [{ f: lastF, tree: GV.tree, p: GV.p, rootU: GV.rootU }],
    title: t('pGardenTitle')(G.name), sub: t('pGardenSub')(fmtDay(G.entries[0].dt, true), n, t('gStages')[Math.min(n, G_FULL)]),
    note: lastF.heart && last.dt === dayKey() ? t('pTodayNote')(t('hana')[lastF.heart]) : ''
  };
}
function gardenAdd(buf) {
  const f = analyzeOrToast(buf); if (!f) return;
  G.name = $('#gName').value.trim().slice(0, 12);
  const c = compact(f, G.name || t('me'), S.heart); c.dt = dayKey();
  const n0 = G.entries.length, replaced = n0 > 0 && G.entries[n0 - 1].dt === c.dt;
  if (replaced) G.entries[n0 - 1] = c; else G.entries.push(c);
  if (G.entries.length > G_MAX) G.entries.splice(1, 1);   // 첫 목소리(나무 모양)는 남기고 오래된 기록부터 정리
  saveGarden();
  const n = G.entries.length, prev = replaced ? n : n - 1;
  GV.from = G_P[Math.min(prev, G_FULL)] - (replaced ? 0.05 : 0); GV.sFrom = G_S[Math.min(prev, G_FULL)];
  GV.to = G_P[Math.min(n, G_FULL)]; GV.sTo = G_S[Math.min(n, G_FULL)];
  GV.start = now() + 0.05; GV.rootU = 0;
  buildGarden();
  if (S.src) { try { S.src.stop(); } catch {} }
  const ctx = getCtx(); S.src = ctx.createBufferSource(); S.src.buffer = f.audio; S.src.connect(ctx.destination); S.src.start(ctx.currentTime + 0.05);
  toast(replaced ? t('gReplaced') : t('gGrew')(n));
  S.heart = 'none'; renderHearts(); renderGarden();
}
function renderGarden() {
  const n = G.entries.length, done = n > 0 && G.entries[n - 1].dt === dayKey();
  $('#gTitle').innerHTML = t('gTitle');
  $('#gLead').textContent = t('gLead');
  if (document.activeElement !== $('#gName')) $('#gName').value = G.name;
  $('#gStat').hidden = !n;
  if (n) {
    $('#gCount').textContent = t('gCount')(n);
    $('#gStage').textContent = t('gStages')[Math.min(n, G_FULL)];
    $('#gBar').style.width = `${Math.min(1, n / G_FULL) * 100}%`;
    $('#gToBloom').textContent = t('gToBloom')(n);
    $('#gToday').textContent = done ? t('gDone') : t('gNotYet');
    const lh = expand(G.entries[n - 1]).heart;
    $('#gNote').textContent = lh && done ? t('pTodayNote')(t('hana')[lh]) : '';
  }
  $('#gRecBtn').textContent = !n ? t('gRecFirst') : done ? t('gRecAgain') : t('gRecToday');
  $('#gLogField').hidden = $('#gBtnRow').hidden = !n;
  const log = $('#gLog'); log.textContent = '';
  for (const c of G.entries.slice().reverse()) {
    const f = expand(c), chip = document.createElement('span'); chip.className = 'chip'; chip.style.paddingRight = '12px';
    const dot = document.createElement('i'); dot.style.background = palFor(f.median).c[0];
    chip.append(dot, `${fmtDay(c.dt)} · ${f.heart ? t('flower')[f.heart][0] : t('noFlower')}`);
    log.append(chip);
  }
}
function setMode(m) {
  S.mode = m === 'garden' ? 'garden' : 'gift';
  frame.dirty = true;
  try { localStorage.setItem('vb.mode', S.mode); } catch {}
  document.querySelectorAll('#modeSeg button').forEach(b => b.classList.toggle('on', b.dataset.mode === S.mode));
  if (S.src) { try { S.src.stop(); } catch {} S.src = null; }
  S.heart = 'none'; renderHearts();
  if (S.mode === 'garden') { $('#intro').hidden = $('#result').hidden = true; $('#garden').hidden = false; renderGarden(); }
  else { $('#garden').hidden = true; if (S.members.length) showResult(); else showIntro(); }
}
$('#modeSeg').onclick = e => { const b = e.target.closest('button'); if (b && b.dataset.mode !== S.mode) setMode(b.dataset.mode); };
$('#gName').oninput = e => { G.name = e.target.value.trim().slice(0, 12); if (G.entries.length) saveGarden(); };
$('#gRecBtn').onclick = () => $('#recBtn').onclick();
$('#gFile').onchange = e => $('#file').onchange(e);
$('#gSaveBtn').onclick = () => {
  const v = gardenView();
  saveArt({ ...v, members: v.members.map(m => ({ ...m, p: GV.to, rootU: 1 })), scaleMul: GV.sTo }, t('pGardenTitle')(G.name));
};
$('#gResetBtn').onclick = () => {
  const b = $('#gResetBtn');
  if (!b.dataset.ok) { b.dataset.ok = '1'; b.textContent = t('gResetConfirm'); b.classList.add('danger');
    setTimeout(() => { delete b.dataset.ok; b.textContent = t('gReset'); b.classList.remove('danger'); }, 3000); return; }
  delete b.dataset.ok; b.textContent = t('gReset'); b.classList.remove('danger');
  G = { name: '', entries: [] }; try { localStorage.removeItem(G_KEY); } catch {}
  GV.start = -1; buildGarden(); renderGarden();
};
$('#langBtn').onclick = () => {
  LANG = LANG === 'ko' ? 'en' : 'ko';
  try { localStorage.setItem('vb.lang', LANG); } catch {}
  applyLang();
};

function analyzeOrToast(buf) {
  try { return analyze(buf); }
  catch (e) { toast(e.message === 'quiet' ? t('tQuiet') : e.message === 'short' ? t('tShort') : t('tBad')); return null; }
}
const route = buf => S.mode === 'garden' ? gardenAdd(buf) : useBuffer(buf);
function useBuffer(buf, fallbackName) {
  if (S.members.length >= MAX_MEMBERS) { toast(t('tMax')(MAX_MEMBERS)); return; }
  const f = analyzeOrToast(buf); if (!f) return;
  const name = ($('#who').value.trim() || fallbackName || t('me')).slice(0, 12);
  const c = compact(f, name, S.heart);
  const m = makeMember(expand(c), c);   // 공유 링크로 열었을 때와 똑같은 나무가 되도록 압축본으로 만든다
  m.audio = f.audio;
  if (!S.date) S.date = today();
  S.members.push(m);
  S.reading = { type: 'member', m };
  showResult(); grow(m);
}
async function decode(arrayBuf) { return await getCtx().decodeAudioData(arrayBuf); }

/* ========== 입력: 녹음 / 파일 / 샘플 ========== */
$('#recBtn').onclick = async () => {
  const ctx = getCtx();
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: true } }); }
  catch { toast(t('tMic')); return; }
  const rec = new MediaRecorder(stream), chunks = [];
  const an = ctx.createAnalyser(); an.fftSize = 1024; ctx.createMediaStreamSource(stream).connect(an);
  const buf = new Float32Array(an.fftSize), ring = $('#ring');
  rec.ondataavailable = e => chunks.push(e.data);
  rec.onstop = async () => {
    stream.getTracks().forEach(tr => tr.stop()); $('#recOverlay').hidden = true;
    let buf;
    try { buf = await decode(await new Blob(chunks).arrayBuffer()); } catch { toast(t('tRecFail')); return; }
    route(buf);
  };
  rec.start(); $('#recOverlay').hidden = false;
  const t0 = performance.now();
  (function meter() {
    if (rec.state !== 'recording') return;
    const left = 10 - (performance.now() - t0) / 1000;
    if (left <= 0) { rec.stop(); return; }
    an.getFloatTimeDomainData(buf); let e = 0; for (const v of buf) e += v * v; e = Math.sqrt(e / buf.length);
    ring.textContent = Math.ceil(left); ring.style.boxShadow = `0 0 ${10 + e * 400}px rgba(255,184,203,${clamp(0.2 + e * 6)})`;
    requestAnimationFrame(meter);
  })();
  $('#stopBtn').onclick = () => rec.state === 'recording' && rec.stop();
};
$('#file').onchange = async e => {
  const file = e.target.files[0]; e.target.value = '';
  if (!file) return;
  let buf;
  try { buf = await decode(await file.arrayBuffer()); } catch { toast(t('tFileFail')); return; }
  route(buf);
};
async function sampleVoice(k) {
  // 말소리처럼 들리는 합성 목소리. k로 목소리 높이를 바꿔 매번 다른 사람처럼 만든다
  const sr = 44100, dur = 3.2, off = new OfflineAudioContext(1, sr * dur, sr);
  const o = off.createOscillator(); o.type = 'sawtooth';
  const g = off.createGain(); g.gain.value = 0;
  const f1 = off.createBiquadFilter(); f1.type = 'bandpass'; f1.frequency.value = 750; f1.Q.value = 4;
  const f2 = off.createBiquadFilter(); f2.type = 'bandpass'; f2.frequency.value = 1250; f2.Q.value = 5;
  o.connect(g); g.connect(f1); g.connect(f2); f1.connect(off.destination); f2.connect(off.destination);
  const r = Math.random;
  let at = 0.15;
  for (let i = 0; i < 6 + Math.floor(r() * 5); i++) {
    const f = (190 + r() * 90) * k, a = 0.5 + r() * 0.5;
    o.frequency.setValueAtTime(f * 0.95, at); o.frequency.linearRampToValueAtTime(f * (1 + (r() - 0.4) * 0.2), at + 0.22);
    g.gain.setValueAtTime(0, at); g.gain.linearRampToValueAtTime(a * 0.5, at + 0.04); g.gain.linearRampToValueAtTime(0, at + 0.26);
    at += 0.26 + r() * 0.12 + (r() < 0.15 ? 0.3 : 0);
    if (at > dur - 0.3) break;
  }
  o.start(); return await off.startRendering();
}
$('#sampleBtn').onclick = async () => {
  getCtx();
  const i = S.members.length % 6, k = [1, 0.58, 1.25, 0.9, 0.5, 1.1][i];
  useBuffer(await sampleVoice(k), t('sampleNames')[i]);
};

/* ========== 결과 화면 ========== */
$('#title').oninput = e => S.title = e.target.value.trim();
function setTheme(name) {
  S.theme = THEMES[name] ? name : 'night';
  frame.dirty = true;
  document.querySelectorAll('#themeSeg button').forEach(x => x.classList.toggle('on', x.dataset.theme === S.theme));
}
$('#themeSeg').onclick = e => { const b = e.target.closest('button'); if (b) setTheme(b.dataset.theme); };
$('#replayBtn').onclick = () => { const m = lastLocal(); if (m) grow(m); };
$('#addBtn').onclick = showIntro;
$('#backBtn').onclick = showResult;
$('#newBtn').onclick = () => {
  const b = $('#newBtn');
  if (!b.dataset.ok) { b.dataset.ok = '1'; b.textContent = t('resetConfirm'); b.classList.add('danger');
    setTimeout(() => { delete b.dataset.ok; b.textContent = t('reset'); b.classList.remove('danger'); }, 3000); return; }
  delete b.dataset.ok; b.textContent = t('reset'); b.classList.remove('danger');
  resetAll();
};
$('#shareBtn').onclick = async () => {
  const url = location.href.split('#')[0] + '#f=' + encodeForest();
  history.replaceState(null, '', url);
  const names = S.members.map(m => m.f.name).join(', ');
  if (navigator.share && /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent)) {
    try { await navigator.share({ title: t('shareTitle'), text: t('shareText')(names), url }); return; } catch {}
  }
  $('#shareBox').hidden = false; const inp = $('#shareUrl'); inp.value = url; inp.select();
  try { await navigator.clipboard.writeText(url); toast(t('tCopied')); }
  catch { toast(t('tCopyManual')); }
};
$('#saveBtn').onclick = () => saveArt({ ...S, members: S.members.map(m => ({ ...m, p: 1, rootU: 1 })) }, S.title || S.members.map(m => m.f.name).join('_'));
async function saveArt(st, label) {
  try { await document.fonts.ready; } catch {}
  const off = document.createElement('canvas'); off.width = 2250; off.height = 3000;
  const c = off.getContext('2d'); c.scale(3, 3);
  renderPoster(c, st, 0);
  off.toBlob(blob => {
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = `${t('filePrefix')}_${label || 'voice'}.png`; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    toast(t('tSaved'));
  }, 'image/png');
};

/* ========== 공유 링크로 열었을 때 ========== */
function loadFromHash() {
  const h = location.hash;
  if (!h.startsWith('#f=')) return;
  try {
    const o = decodeForest(h.slice(3));
    const members = o.m.slice(0, MAX_MEMBERS).map(c => makeMember(expand(c), c));
    S.members = members; S.title = typeof o.t === 'string' ? o.t.slice(0, 24) : ''; S.date = typeof o.dt === 'string' ? o.dt.slice(0, 16) : today();
    setTheme(o.th); $('#title').value = S.title;
    // 공유받은 숲은 한 그루씩 차례로 피어나게
    members.forEach(m => { m.p = 0; m.rootU = 0; });
    S.queue = members.slice();
    S.reading = { type: 'link' };
    setMode('gift');
  } catch { toast(t('tLinkFail')); }
}

fitCanvas();
buildGarden();
applyLang();
if (location.hash.startsWith('#f=')) loadFromHash();
else { let m = 'gift'; try { m = localStorage.getItem('vb.mode') || 'gift'; } catch {} setMode(m); }
requestAnimationFrame(frame);
</script>
